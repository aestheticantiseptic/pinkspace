<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>View Profile | PinkSpace</title>
  <style>
    body { background-color: #ffe6f2 !important; color: #4a0026 !important; font-family: Arial, Helvetica, sans-serif !important; font-size: 13px !important; margin: 0; padding: 0; }
    a { color: #d1006c !important; text-decoration: none !important; font-weight: bold; }
    a:hover { text-decoration: underline !important; color: #ff007f !important; }
    .container { max-width: 950px; margin: 20px auto; background-color: #ffffff; border: 2px solid #ff66b2 !important; padding: 15px; box-shadow: 3px 3px 0px #ffb3d9; }
    nav .top { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 2px solid #ff66b2; }
    .logo { font-size: 28px; font-weight: bold; color: #ff007f !important; text-shadow: 1px 1px 0px #ffb3d9; letter-spacing: -1px; }
    .links { list-style: none; padding: 0; margin: 10px 0; background-color: #ff66b2 !important; display: flex; flex-wrap: wrap; justify-content: space-around; border: 1px solid #d1006c; }
    .links li { padding: 6px 10px; }
    .links li a { color: #ffffff !important; font-size: 13px; text-decoration: none; }
    .row { display: flex; gap: 15px; margin-top: 15px; }
    .col { display: flex; flex-direction: column; }
    .w-40 { width: 40%; }
    .w-60 { width: 60%; }
    .module-box { border: 2px solid #ff66b2 !important; background-color: #fff9fc !important; margin-bottom: 15px; }
    .heading { background-color: #ffb3d9 !important; padding: 5px 10px; border-bottom: 2px solid #ff66b2; color: #800040 !important; font-weight: bold; }
    .inner { padding: 10px; }
    .avatar-fallback { width: 130px; height: 160px; border: 2px dashed #ff66b2; background-color: #ffe6f2; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #ff007f; font-size: 11px; font-weight: bold; text-transform: uppercase; }
    .friend-space-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; text-align: center; margin-top: 10px; }
    .friend-cell { display: flex; flex-direction: column; align-items: center; }
    .friend-pfp { width: 80px; height: 90px; border: 1px solid #ff66b2; background-color: #ffd9ec; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #ff007f; margin-bottom: 4px; }
    .comment-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .comment-table td { border: 1px solid #ffb3d9; padding: 8px; }
    .comment-left { width: 100px; text-align: center; background-color: #ffd9ec; }
    textarea { border: 1px solid #ff66b2 !important; background-color: #fff0f5 !important; padding: 5px; width: 95%; }
    button { background-color: #ff66b2 !important; color: white !important; border: 1px solid #d1006c !important; padding: 4px 10px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <nav>
      <div class="top">
        <div class="left"><a href="index.html" class="logo">pinkSpace</a></div>
        <div class="right"><a href="login.html">LogOut</a></div>
      </div>
      <ul class="links">
        <li><a href="index.html">Home</a></li>
        <li><a href="browse.html">Browse</a></li>
        <li class="active"><a href="profile.html">View Profile</a></li>
        <li><a href="bulletins.html">Bulletins</a></li>
        <li><a href="forum.html">Forum</a></li>
        <li><a href="layouts.html">Layouts</a></li>
        <li><a href="favorites.html">Favs</a></li>
        <li><a href="chatrooms.html">Chatrooms</a></li>
      </ul>
    </nav>
    <main>
      <div class="row">
        <div class="col w-40 left">
          <div class="module-box header-card">
            <div class="heading"><h4>AestheticAntiseptic</h4></div>
            <div class="inner">
              <div class="profile-pic-container"><div class="avatar-fallback">Online</div></div>
            </div>
          </div>
          <div class="module-box contact-actions">
            <div class="heading"><h4>Contacting Member</h4></div>
            <div class="inner"><p>✉ <a href="im.html">Send Message</a></p></div>
          </div>
        </div>
        <div class="col w-60 right">
          <div class="module-box blurbs">
            <div class="heading"><h4>Blurbs</h4></div>
            <div class="inner"><p>Welcome to this public profile view container layout.</p></div>
          </div>
          <div class="module-box comment-wall">
            <div class="heading"><h4>Comments Board</h4></div>
            <div class="inner">
              <textarea id="comment-text" rows="3" placeholder="Type comment..."></textarea>
              <button onclick="postLocalComment()">Post Comment</button>
              <table class="comment-table" id="comment-feed-target"></table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="https://jsdelivr.net"></script>
  <script>
    const SUPABASE_URL = "https://supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_2DWBfoCYTHLT-hDVvN-Trw_P3PWw6YX";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    function postLocalComment() {
      const txt = document.getElementById('comment-text'); if(txt.value.trim()==="") return;
      const tr = document.createElement('tr'); tr.innerHTML = `<td class="comment-left">Guest</td><td>${txt.value.trim()}</td>`;
      document.getElementById('comment-feed-target').appendChild(tr); txt.value="";
    }
    async function loadProfile() {
      const { data: { session } } = await supabase.auth.getSession();
      if(session && session.user) {
        const meta = session.user.user_metadata;
        if(meta.username) document.querySelector('.header-card h4').innerText = meta.username;
        if(meta.custom_css) {
          const style = document.createElement('style'); style.innerHTML = meta.custom_css; document.head.appendChild(style);
        }
      }
    }
    document.addEventListener('DOMContentLoaded', loadProfile);
  </script>
</body>
</html>
